<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="common.css"/>
<style>
  .glow{position:absolute;top:300px;left:50%;transform:translateX(-50%);
    width:780px;height:420px;z-index:1;pointer-events:none;
    background:radial-gradient(closest-side, rgba(108,140,255,.55), rgba(108,140,255,0) 70%);
    filter:blur(8px);}
  .phone{position:absolute;top:362px;left:50%;transform:translateX(-50%);width:912px;z-index:2;
    filter:drop-shadow(0 32px 44px rgba(6,12,52,.55));}
  .burst{position:absolute;top:372px;left:96px;width:120px;height:120px;z-index:2;}
  .bubble{position:absolute;top:516px;left:126px;z-index:3;
    background:#2f63ff;color:#fff;font-family:'Inter Display','Inter',sans-serif;font-weight:800;
    font-size:44px;letter-spacing:-.02em;padding:16px 32px 20px;border-radius:22px;
    box-shadow:0 18px 32px rgba(8,16,60,.42);}
  .bubble::after{content:"";position:absolute;left:36px;bottom:-18px;
    border-left:0 solid transparent;border-right:30px solid transparent;border-top:24px solid #2f63ff;}
  .copy{position:absolute;left:76px;right:76px;top:872px;z-index:3;}
  .headline{font-size:118px;line-height:.96;}
  .sub{margin-top:34px;max-width:860px;}
</style></head>
<body>
  <div class="canvas dark">
    <div class="frame">
      <div class="head">
        <div class="logo"><span class="dot"></span><div><b>rizz</b><span>dial</span></div></div>
        <div class="counter"><em>03</em> / 06</div>
      </div>

      <div class="glow"></div>
      <svg class="burst" viewBox="0 0 120 120" fill="none">
        <g stroke="#c8f94c" stroke-width="8" stroke-linecap="round">
          <line x1="92" y1="22" x2="66" y2="48"/>
          <line x1="44" y1="10" x2="44" y2="44"/>
          <line x1="10" y1="44" x2="42" y2="58"/>
        </g>
      </svg>
      <img class="phone" src="assets/red-phone.png" alt="red telephone handset"/>
      <div class="bubble">Hello.</div>

      <div class="copy">
        <div class="eyebrow">The Fix</div>
        <h1 class="headline">Meet <span class="hi">RizzDial.</span></h1>
        <p class="sub">A live AI call to every new lead in under <span class="u">60 seconds</span>. 24/7. No lead left waiting.</p>
      </div>

      <div class="foot">
        <div class="dots"><i></i><i></i><i class="on"></i><i></i><i></i><i></i></div>
        <div class="swipe">swipe <em>&rarr;</em></div>
      </div>
    </div>
  </div>
</body></html>
