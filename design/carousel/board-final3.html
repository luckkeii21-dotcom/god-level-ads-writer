<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:#0033de;}
  .canvas{position:relative;width:1080px;height:1350px;overflow:hidden;
    font-family:'Inter Display','Inter',sans-serif;-webkit-font-smoothing:antialiased;background:#0033de;}
  .focal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:1020px;height:1020px;z-index:1;
    background:radial-gradient(circle, rgba(120,150,255,.20), rgba(120,150,255,0) 60%);pointer-events:none;}
  .grain{position:absolute;inset:0;z-index:8;pointer-events:none;opacity:.06;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}

  .logo{position:absolute;top:66px;left:50%;transform:translateX(-50%);z-index:7;width:248px;height:auto;display:block;}
  .pill{position:absolute;top:196px;left:50%;transform:translateX(-50%);z-index:7;
    background:#ffffff;color:#0a2fbf;font-weight:700;font-size:23px;letter-spacing:-.01em;
    padding:12px 28px;border-radius:999px;box-shadow:0 12px 28px rgba(2,16,80,.34);}

  .people{position:absolute;inset:0;z-index:2;}

  .card{position:absolute;left:325px;top:500px;width:430px;height:316px;z-index:4;
    background:linear-gradient(180deg,#ffffff,#f3f5fb);border-radius:28px;
    box-shadow:0 46px 84px rgba(2,16,80,.5), 0 4px 10px rgba(2,16,80,.34);padding:22px 26px;display:flex;flex-direction:column;}
  .chead{display:flex;align-items:center;gap:12px;}
  .av{width:50px;height:50px;border-radius:50%;flex:0 0 auto;
    background:url("../assets/james.jpeg") center 22%/cover;box-shadow:0 4px 10px rgba(2,16,80,.3);}
  .who{display:flex;flex-direction:column;}
  .who .n{display:flex;align-items:center;gap:7px;font-weight:800;font-size:22px;color:#15171d;letter-spacing:-.01em;}
  .who .n .vf{width:18px;height:18px;border-radius:50%;background:#2347ec;display:flex;align-items:center;justify-content:center;}
  .who .n .rt{color:#f0a93f;font-weight:700;font-size:18px;}
  .who .t{font-size:15px;color:#9aa0ac;margin-top:1px;}
  .addic{margin-left:auto;color:#2347ec;}
  .ctext{flex:1;display:flex;align-items:center;justify-content:center;}
  .ctext h2{font-family:'Bitstream Charter','Georgia',serif;font-weight:700;
    font-size:46px;color:#16223f;text-align:center;line-height:1.04;}
  .ctext h2 i{font-style:italic;color:#2347ec;}
  .eng{display:flex;align-items:center;gap:24px;border-top:1px solid #eef0f5;padding-top:14px;}
  .eng .it{display:flex;align-items:center;gap:8px;color:#8a90a0;font-weight:600;font-size:18px;}
  .eng .it.liked{color:#2347ec;}
  .eng .bm{margin-left:auto;}

  .tagline{position:absolute;left:80px;right:80px;bottom:170px;z-index:7;text-align:center;
    font-weight:500;font-size:42px;line-height:1.3;color:#cdd9ff;letter-spacing:-.015em;}
  .tagline b{color:#fff;font-weight:800;}
  .url{position:absolute;bottom:76px;left:0;right:0;text-align:center;z-index:7;
    font-family:'Liberation Mono',monospace;font-size:21px;letter-spacing:.22em;color:rgba(255,255,255,.5);}
</style></head>
<body>
<div class="canvas">
  <div class="focal"></div>
  <img class="logo" src="../assets/rizzdial-logo.jpeg" alt="RizzDial"/>
  <div class="pill">The psychology of selling</div>

  <svg class="people" viewBox="0 0 1080 1350" fill="none">
    <defs>
      <filter id="shadow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
      <radialGradient id="skA" cx=".42" cy=".34" r=".8"><stop offset="0" stop-color="#f6d3ad"/><stop offset="1" stop-color="#e0ad7f"/></radialGradient>
      <radialGradient id="skB" cx=".42" cy=".34" r=".8"><stop offset="0" stop-color="#edc095"/><stop offset="1" stop-color="#d29c6b"/></radialGradient>
      <radialGradient id="skC" cx=".42" cy=".34" r=".8"><stop offset="0" stop-color="#c68a59"/><stop offset="1" stop-color="#9c6234"/></radialGradient>
      <radialGradient id="skD" cx=".42" cy=".34" r=".8"><stop offset="0" stop-color="#f1c79c"/><stop offset="1" stop-color="#d7a06f"/></radialGradient>
    </defs>

    <!-- ===== TOP — James (glasses, wavy hair, olive shirt) ===== -->
    <g transform="translate(540,332) scale(.94)">
      <ellipse cx="0" cy="150" rx="120" ry="66" fill="#021560" opacity=".34" filter="url(#shadow)"/>
      <path d="M-98 168 C-98 96 -54 70 0 70 C54 70 98 96 98 168 Z" fill="#6f7d52"/>
      <path d="M-98 168 C-86 110 -50 92 0 92 C50 92 86 110 98 168" fill="#ffffff" opacity=".08"/>
      <rect x="-18" y="40" width="36" height="34" rx="14" fill="url(#skA)"/><rect x="-18" y="54" width="36" height="20" fill="#a9764a" opacity=".22"/>
      <ellipse cx="-52" cy="6" rx="11" ry="15" fill="url(#skA)"/><ellipse cx="52" cy="6" rx="11" ry="15" fill="url(#skA)"/>
      <ellipse cx="0" cy="0" rx="52" ry="60" fill="url(#skA)"/>
      <!-- stubble -->
      <path d="M-44 22 C-34 56 34 56 44 22 C36 44 -36 44 -44 22 Z" fill="#5a4030" opacity=".16"/>
      <!-- brows -->
      <path d="M-34 -14 q12 -8 24 -2 M10 -16 q12 -6 24 2" stroke="#4a3528" stroke-width="5" fill="none" stroke-linecap="round"/>
      <!-- eyes -->
      <ellipse cx="-22" cy="2" rx="11" ry="8" fill="#fff"/><circle cx="-21" cy="2" r="5.4" fill="#3a2a1c"/><circle cx="-19" cy="0" r="1.6" fill="#fff"/>
      <ellipse cx="22" cy="2" rx="11" ry="8" fill="#fff"/><circle cx="23" cy="2" r="5.4" fill="#3a2a1c"/><circle cx="25" cy="0" r="1.6" fill="#fff"/>
      <!-- nose + mouth -->
      <path d="M-3 8 Q-7 22 3 22" stroke="#c89568" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M-15 38 Q0 47 15 38" stroke="#a85f54" stroke-width="5" fill="none" stroke-linecap="round"/>
      <!-- glasses -->
      <g stroke="#15151a" stroke-width="4.4" fill="none"><rect x="-40" y="-12" width="32" height="28" rx="9"/><rect x="8" y="-12" width="32" height="28" rx="9"/><path d="M-8 -1 h16 M-40 -5 h-11 M40 -5 h11"/></g>
      <path d="M-36 -8 l10 -2 M12 -8 l10 -2" stroke="#ffffff" stroke-opacity=".5" stroke-width="2.4" stroke-linecap="round"/>
      <!-- wavy hair -->
      <path d="M-53 -2 C-60 -54 -28 -74 0 -74 C30 -74 60 -52 53 -2 C48 -26 40 -28 35 -18 C31 -34 21 -36 15 -25 C11 -38 -3 -40 -7 -27 C-13 -39 -25 -35 -29 -22 C-35 -33 -45 -28 -49 -14 C-51 -9 -53 -7 -53 -2 Z" fill="#5a4030"/>
      <path d="M-44 -22 C-30 -40 8 -44 30 -30" stroke="#6e503d" stroke-width="4" fill="none" stroke-linecap="round" opacity=".7"/>
    </g>

    <!-- ===== RIGHT — woman, long dark hair, purple top ===== -->
    <g transform="translate(912,648) scale(.94)">
      <ellipse cx="0" cy="150" rx="116" ry="64" fill="#021560" opacity=".3" filter="url(#shadow)"/>
      <path d="M-96 168 C-96 98 -52 72 0 72 C52 72 96 98 96 168 Z" fill="#7d5aa8"/>
      <!-- long hair behind -->
      <path d="M-58 -6 C-60 -66 -30 -82 0 -82 C30 -82 60 -66 58 -6 C58 52 52 92 48 120 L30 120 C38 80 42 34 38 -8 C28 -42 -28 -42 -38 -8 C-42 34 -38 80 -30 120 L-48 120 C-52 92 -58 52 -58 -6 Z" fill="#211b18"/>
      <rect x="-17" y="40" width="34" height="32" rx="13" fill="url(#skB)"/><rect x="-17" y="52" width="34" height="20" fill="#a9764a" opacity=".22"/>
      <ellipse cx="-50" cy="6" rx="10" ry="14" fill="url(#skB)"/><ellipse cx="50" cy="6" rx="10" ry="14" fill="url(#skB)"/>
      <circle cx="-50" cy="20" r="4" fill="#e3b94a"/><circle cx="50" cy="20" r="4" fill="#e3b94a"/>
      <ellipse cx="0" cy="0" rx="50" ry="58" fill="url(#skB)"/>
      <path d="M-32 -14 q12 -7 22 -1 M10 -15 q12 -6 22 1" stroke="#2a2018" stroke-width="4.6" fill="none" stroke-linecap="round"/>
      <ellipse cx="-21" cy="2" rx="10.5" ry="7.6" fill="#fff"/><circle cx="-20" cy="2" r="5" fill="#2f2218"/><circle cx="-18" cy="0" r="1.5" fill="#fff"/>
      <ellipse cx="21" cy="2" rx="10.5" ry="7.6" fill="#fff"/><circle cx="22" cy="2" r="5" fill="#2f2218"/><circle cx="24" cy="0" r="1.5" fill="#fff"/>
      <path d="M-3 7 Q-7 20 3 20" stroke="#bd8a5e" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M-14 36 Q0 46 14 36" stroke="#b35f63" stroke-width="5" fill="none" stroke-linecap="round"/>
      <!-- hair front sweep -->
      <path d="M-52 -4 C-56 -60 -26 -78 0 -78 C26 -78 56 -60 52 -4 C40 -34 -6 -36 -18 -20 C-24 -32 -42 -28 -52 -4 Z" fill="#211b18"/>
    </g>

    <!-- ===== BOTTOM — man, beard, slate shirt ===== -->
    <g transform="translate(540,964) scale(.94)">
      <ellipse cx="0" cy="146" rx="118" ry="64" fill="#021560" opacity=".3" filter="url(#shadow)"/>
      <path d="M-98 168 C-98 98 -54 72 0 72 C54 72 98 98 98 168 Z" fill="#56627d"/>
      <rect x="-18" y="40" width="36" height="32" rx="13" fill="url(#skC)"/>
      <ellipse cx="-51" cy="4" rx="10" ry="14" fill="url(#skC)"/><ellipse cx="51" cy="4" rx="10" ry="14" fill="url(#skC)"/>
      <ellipse cx="0" cy="0" rx="51" ry="59" fill="url(#skC)"/>
      <!-- beard -->
      <path d="M-49 0 C-48 46 -24 70 0 70 C24 70 48 46 49 0 C46 18 30 30 0 30 C-30 30 -46 18 -49 0 Z" fill="#241a12"/>
      <path d="M-34 -16 q12 -7 22 -1 M12 -17 q12 -6 22 1" stroke="#171009" stroke-width="5" fill="none" stroke-linecap="round"/>
      <ellipse cx="-21" cy="0" rx="10.5" ry="7.6" fill="#fff"/><circle cx="-20" cy="0" r="5" fill="#241a10"/><circle cx="-18" cy="-2" r="1.5" fill="#fff"/>
      <ellipse cx="21" cy="0" rx="10.5" ry="7.6" fill="#fff"/><circle cx="22" cy="0" r="5" fill="#241a10"/><circle cx="24" cy="-2" r="1.5" fill="#fff"/>
      <path d="M-3 6 Q-7 20 3 20" stroke="#9d6536" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M-13 34 Q0 42 13 34" stroke="#7a3f33" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <!-- short hair -->
      <path d="M-50 -4 C-54 -50 -26 -68 0 -68 C26 -68 54 -50 50 -4 C42 -28 6 -32 0 -32 C-6 -32 -42 -28 -50 -4 Z" fill="#15110c"/>
    </g>

    <!-- ===== LEFT — woman, curly hair, terracotta shirt ===== -->
    <g transform="translate(168,648) scale(.94)">
      <ellipse cx="0" cy="150" rx="116" ry="64" fill="#021560" opacity=".3" filter="url(#shadow)"/>
      <path d="M-96 168 C-96 98 -52 72 0 72 C52 72 96 98 96 168 Z" fill="#c2654a"/>
      <!-- curly hair behind -->
      <g fill="#2e2017"><circle cx="0" cy="-44" r="30"/><circle cx="-38" cy="-28" r="24"/><circle cx="38" cy="-28" r="24"/><circle cx="-52" cy="6" r="22"/><circle cx="52" cy="6" r="22"/><circle cx="-46" cy="36" r="18"/><circle cx="46" cy="36" r="18"/></g>
      <rect x="-17" y="40" width="34" height="32" rx="13" fill="url(#skD)"/>
      <ellipse cx="-50" cy="6" rx="10" ry="14" fill="url(#skD)"/><ellipse cx="50" cy="6" rx="10" ry="14" fill="url(#skD)"/>
      <ellipse cx="0" cy="0" rx="50" ry="58" fill="url(#skD)"/>
      <path d="M-32 -14 q12 -7 22 -1 M10 -15 q12 -6 22 1" stroke="#2a1d14" stroke-width="4.6" fill="none" stroke-linecap="round"/>
      <ellipse cx="-21" cy="2" rx="10.5" ry="7.6" fill="#fff"/><circle cx="-20" cy="2" r="5" fill="#3a281c"/><circle cx="-18" cy="0" r="1.5" fill="#fff"/>
      <ellipse cx="21" cy="2" rx="10.5" ry="7.6" fill="#fff"/><circle cx="22" cy="2" r="5" fill="#3a281c"/><circle cx="24" cy="0" r="1.5" fill="#fff"/>
      <path d="M-3 7 Q-7 20 3 20" stroke="#c0875a" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M-14 36 Q0 47 14 36" stroke="#b35a52" stroke-width="5" fill="none" stroke-linecap="round"/>
      <!-- front curls framing -->
      <g fill="#2e2017"><circle cx="-40" cy="-32" r="17"/><circle cx="40" cy="-32" r="17"/><circle cx="-8" cy="-52" r="18"/><circle cx="22" cy="-48" r="16"/></g>
    </g>
  </svg>

  <div class="card">
    <div class="chead">
      <div class="av"></div>
      <div class="who">
        <div class="n">James Hill <span class="vf"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span><span class="rt">★ 4.5</span></div>
        <div class="t">42 seconds ago</div>
      </div>
      <div class="addic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2347ec" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M18 8v6M21 11h-6"/></svg></div>
    </div>
    <div class="ctext"><h2>The Psychology<br/>of <i>Yes</i></h2></div>
    <div class="eng">
      <div class="it liked"><svg width="20" height="20" viewBox="0 0 24 24" fill="#2347ec" stroke="#2347ec" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v10M7 10l4-7a2 2 0 013 2l-1 5h5a2 2 0 012 2.3l-1.2 6A2 2 0 0119.8 20H7"/></svg>3.2k</div>
      <div class="it"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8a90a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 01-11.5 7.2L4 20l1-5A8 8 0 1121 12z"/></svg>214</div>
      <div class="it"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8a90a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>44k</div>
      <div class="it"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8a90a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg></div>
      <div class="it bm"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8a90a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 011 1v17l-7-4-7 4V4a1 1 0 011-1z"/></svg></div>
    </div>
  </div>

  <div class="tagline">Where great sellers don't <b>chase</b> the deal,<br/>they <b>earn</b> the yes.</div>
  <div class="url">rizzdial.com</div>
  <div class="grain"></div>
</div>
</body></html>
