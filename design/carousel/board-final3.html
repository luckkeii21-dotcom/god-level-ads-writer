<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:#0033de;}
  .canvas{position:relative;width:1080px;height:1350px;overflow:hidden;
    font-family:'Inter Display','Inter',sans-serif;-webkit-font-smoothing:antialiased;background:#0033de;}
  .focal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:1020px;height:1020px;z-index:1;
    background:radial-gradient(circle, rgba(120,150,255,.20), rgba(120,150,255,0) 60%);pointer-events:none;}
  .grain{position:absolute;inset:0;z-index:8;pointer-events:none;opacity:.06;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}

  .logo{position:absolute;top:64px;left:50%;transform:translateX(-50%);z-index:7;width:248px;height:auto;display:block;}
  .pill{position:absolute;top:188px;left:50%;transform:translateX(-50%);z-index:7;
    background:#ffffff;color:#0a2fbf;font-weight:700;font-size:23px;letter-spacing:-.01em;
    padding:12px 28px;border-radius:999px;box-shadow:0 12px 28px rgba(2,16,80,.34);}

  .people{position:absolute;inset:0;z-index:2;}

  .card{position:absolute;left:325px;top:502px;width:430px;height:320px;z-index:4;
    background:linear-gradient(180deg,#ffffff,#f3f5fb);border-radius:28px;
    box-shadow:0 46px 84px rgba(2,16,80,.5), 0 4px 10px rgba(2,16,80,.34);padding:22px 26px;display:flex;flex-direction:column;}
  .chead{display:flex;align-items:center;gap:12px;}
  .av{width:50px;height:50px;border-radius:50%;flex:0 0 auto;
    background:url("../assets/james.jpeg") center 22%/cover;box-shadow:0 4px 10px rgba(2,16,80,.3);}
  .who{display:flex;flex-direction:column;}
  .who .n{display:flex;align-items:center;gap:7px;font-weight:800;font-size:22px;color:#15171d;letter-spacing:-.01em;white-space:nowrap;}
  .who .n .vf{width:18px;height:18px;border-radius:50%;background:#2347ec;display:flex;align-items:center;justify-content:center;}
  .who .n .rt{color:#f0a93f;font-weight:700;font-size:18px;}
  .who .t{font-size:15px;color:#9aa0ac;margin-top:1px;}
  .addic{margin-left:auto;color:#2347ec;}
  .ctext{flex:1;display:flex;align-items:center;justify-content:center;}
  .ctext h2{font-family:'Bitstream Charter','Georgia',serif;font-weight:700;
    font-size:46px;color:#16223f;text-align:center;line-height:1.04;}
  .ctext h2 i{font-style:italic;color:#2347ec;}
  .eng{display:flex;align-items:center;gap:24px;border-top:1px solid #eef0f5;padding-top:14px;}
  .eng .it{display:flex;align-items:center;gap:8px;color:#8a90a0;font-weight:600;font-size:18px;}
  .eng .it.liked{color:#2347ec;}
  .eng .bm{margin-left:auto;}

  .tagline{position:absolute;left:80px;right:80px;bottom:152px;z-index:7;text-align:center;
    font-weight:500;font-size:42px;line-height:1.3;color:#cdd9ff;letter-spacing:-.015em;}
  .tagline b{color:#fff;font-weight:800;}
  .url{position:absolute;bottom:62px;left:0;right:0;text-align:center;z-index:7;
    font-family:'Liberation Mono',monospace;font-size:21px;letter-spacing:.22em;color:rgba(255,255,255,.5);}
</style></head>
<body>
<div class="canvas">
  <div class="focal"></div>
  <img class="logo" src="../assets/rizzdial-logo.jpeg" alt="RizzDial"/>
  <div class="pill">The psychology of selling</div>

  <svg class="people" viewBox="0 0 1080 1350" fill="none">
    <defs>
      <filter id="shadow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
      <radialGradient id="skA" cx=".42" cy=".34" r=".8"><stop offset="0" stop-color="#ffe7d6"/><stop offset="1" stop-color="#f6cbb0"/></radialGradient>
      <radialGradient id="skB" cx=".42" cy=".34" r=".8"><stop offset="0" stop-color="#ffeadd"/><stop offset="1" stop-color="#f8d2bb"/></radialGradient>
      <radialGradient id="skC" cx=".42" cy=".34" r=".8"><stop offset="0" stop-color="#90582f"/><stop offset="1" stop-color="#623a1d"/></radialGradient>
      <radialGradient id="skD" cx=".42" cy=".34" r=".8"><stop offset="0" stop-color="#ffe6d4"/><stop offset="1" stop-color="#f4cab0"/></radialGradient>

      <!-- shared face body: shoulders + neck + head + ears (compact crop) -->
      <g id="torso">
        <ellipse cx="0" cy="118" rx="110" ry="50" fill="#021560" opacity=".32" filter="url(#shadow)"/>
        <path d="M-94 132 C-94 82 -52 62 0 62 C52 62 94 82 94 132 Z" fill="currentColor"/>
        <path d="M-94 132 C-82 96 -48 80 0 80 C48 80 82 96 94 132" fill="#ffffff" opacity=".07"/>
      </g>
      <!-- office chair (back behind person, armrests in front) -->
      <g id="chairback">
        <rect x="-112" y="-104" width="224" height="244" rx="52" fill="#525e8c"/>
        <rect x="-112" y="-104" width="224" height="120" rx="52" fill="#ffffff" opacity=".08"/>
        <rect x="-112" y="-104" width="224" height="244" rx="52" fill="none" stroke="#6a78ad" stroke-opacity=".5" stroke-width="2"/>
      </g>
      <g id="armrests">
        <rect x="-128" y="64" width="46" height="22" rx="11" fill="#3b4570"/>
        <rect x="82" y="64" width="46" height="22" rx="11" fill="#3b4570"/>
      </g>
    </defs>

    <!-- ===== TOP — white man, glasses (James), olive shirt ===== -->
    <g transform="translate(540,324) scale(.82)">
      <use href="#chairback"/>
      <use href="#torso" style="color:#6f7d52"/>
      <rect x="-18" y="38" width="36" height="34" rx="14" fill="url(#skA)"/><rect x="-18" y="52" width="36" height="20" fill="#e6ac88" opacity=".12"/>
      <ellipse cx="-52" cy="4" rx="11" ry="15" fill="url(#skA)"/><ellipse cx="52" cy="4" rx="11" ry="15" fill="url(#skA)"/>
      <ellipse cx="0" cy="-2" rx="52" ry="60" fill="url(#skA)"/>
      <path d="M-44 20 C-34 54 34 54 44 20 C36 42 -36 42 -44 20 Z" fill="#5a4030" opacity=".15"/>
      <path d="M-34 -16 q12 -8 24 -2 M10 -18 q12 -6 24 2" stroke="#4a3528" stroke-width="5" fill="none" stroke-linecap="round"/>
      <ellipse cx="-22" cy="0" rx="11" ry="8" fill="#fff"/><circle cx="-21" cy="0" r="5.4" fill="#6f7a46"/><circle cx="-19" cy="-2" r="1.6" fill="#fff"/>
      <ellipse cx="22" cy="0" rx="11" ry="8" fill="#fff"/><circle cx="23" cy="0" r="5.4" fill="#6f7a46"/><circle cx="25" cy="-2" r="1.6" fill="#fff"/>
      <path d="M-3 6 Q-7 20 3 20" stroke="#cf9a6b" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M-15 36 Q0 45 15 36" stroke="#ad6055" stroke-width="5" fill="none" stroke-linecap="round"/>
      <g stroke="#15151a" stroke-width="4.4" fill="none"><rect x="-40" y="-14" width="32" height="28" rx="9"/><rect x="8" y="-14" width="32" height="28" rx="9"/><path d="M-8 -3 h16 M-40 -7 h-11 M40 -7 h11"/></g>
      <path d="M-36 -10 l10 -2 M12 -10 l10 -2" stroke="#ffffff" stroke-opacity=".5" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M-53 -4 C-60 -56 -28 -76 0 -76 C30 -76 60 -54 53 -4 C48 -28 40 -30 35 -20 C31 -36 21 -38 15 -27 C11 -40 -3 -42 -7 -29 C-13 -41 -25 -37 -29 -24 C-35 -35 -45 -30 -49 -16 C-51 -11 -53 -9 -53 -4 Z" fill="#5a4030"/>
      <path d="M-44 -24 C-30 -42 8 -46 30 -32" stroke="#6e503d" stroke-width="4" fill="none" stroke-linecap="round" opacity=".7"/>
    </g>

    <!-- ===== RIGHT — white woman, blonde long hair ===== -->
    <g transform="translate(902,662) scale(.82)">
      <use href="#chairback"/>
      <use href="#torso" style="color:#df8aa0"/>
      <path d="M-58 -8 C-60 -68 -30 -84 0 -84 C30 -84 60 -68 58 -8 C58 50 52 90 48 116 L30 116 C38 76 42 32 38 -10 C28 -44 -28 -44 -38 -10 C-42 32 -38 76 -30 116 L-48 116 C-52 90 -58 50 -58 -8 Z" fill="#dcc06f"/>
      <rect x="-17" y="38" width="34" height="32" rx="13" fill="url(#skB)"/><rect x="-17" y="50" width="34" height="20" fill="#e6ac88" opacity=".2"/>
      <ellipse cx="-50" cy="4" rx="10" ry="14" fill="url(#skB)"/><ellipse cx="50" cy="4" rx="10" ry="14" fill="url(#skB)"/>
      <circle cx="-50" cy="18" r="4" fill="#e3b94a"/><circle cx="50" cy="18" r="4" fill="#e3b94a"/>
      <ellipse cx="0" cy="-2" rx="50" ry="58" fill="url(#skB)"/>
      <path d="M-32 -16 q12 -7 22 -1 M10 -17 q12 -6 22 1" stroke="#8a6a30" stroke-width="4.4" fill="none" stroke-linecap="round"/>
      <ellipse cx="-21" cy="0" rx="10.5" ry="7.6" fill="#fff"/><circle cx="-20" cy="0" r="5" fill="#5a78a8"/><circle cx="-18" cy="-2" r="1.5" fill="#fff"/>
      <ellipse cx="21" cy="0" rx="10.5" ry="7.6" fill="#fff"/><circle cx="22" cy="0" r="5" fill="#5a78a8"/><circle cx="24" cy="-2" r="1.5" fill="#fff"/>
      <path d="M-3 5 Q-7 18 3 18" stroke="#d59f70" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M-14 34 Q0 44 14 34" stroke="#c66a72" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M-52 -6 C-56 -62 -26 -80 0 -80 C26 -80 56 -62 52 -6 C40 -36 -6 -38 -18 -22 C-24 -34 -42 -30 -52 -6 Z" fill="#dcc06f"/>
      <path d="M-40 -28 C-22 -44 14 -44 34 -28" stroke="#ddbd72" stroke-width="4" fill="none" stroke-linecap="round" opacity=".8"/>
    </g>

    <!-- ===== BOTTOM — Black man, beard ===== -->
    <g transform="translate(540,944) scale(.82)">
      <use href="#chairback"/>
      <use href="#torso" style="color:#56627d"/>
      <rect x="-18" y="38" width="36" height="32" rx="13" fill="url(#skC)"/>
      <ellipse cx="-51" cy="2" rx="10" ry="14" fill="url(#skC)"/><ellipse cx="51" cy="2" rx="10" ry="14" fill="url(#skC)"/>
      <ellipse cx="0" cy="-2" rx="51" ry="59" fill="url(#skC)"/>
      <path d="M-49 -2 C-48 46 -24 70 0 70 C24 70 48 46 49 -2 C46 16 30 28 0 28 C-30 28 -46 16 -49 -2 Z" fill="#1a130d"/>
      <path d="M-34 -18 q12 -7 22 -1 M12 -19 q12 -6 22 1" stroke="#0f0a06" stroke-width="5" fill="none" stroke-linecap="round"/>
      <ellipse cx="-21" cy="-2" rx="10.5" ry="7.6" fill="#fff"/><circle cx="-20" cy="-2" r="5" fill="#231708"/><circle cx="-18" cy="-4" r="1.5" fill="#fff"/>
      <ellipse cx="21" cy="-2" rx="10.5" ry="7.6" fill="#fff"/><circle cx="22" cy="-2" r="5" fill="#231708"/><circle cx="24" cy="-4" r="1.5" fill="#fff"/>
      <path d="M-3 4 Q-7 18 3 18" stroke="#6e431f" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M-13 32 Q0 40 13 32" stroke="#7d4636" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <path d="M-50 -6 C-54 -52 -26 -70 0 -70 C26 -70 54 -52 50 -6 C42 -30 6 -34 0 -34 C-6 -34 -42 -30 -50 -6 Z" fill="#15110c"/>
    </g>

    <!-- ===== LEFT — brunette woman, wavy hair ===== -->
    <g transform="translate(178,662) scale(.82)">
      <use href="#chairback"/>
      <use href="#torso" style="color:#c2654a"/>
      <path d="M-56 -6 C-58 -66 -30 -82 0 -82 C30 -82 58 -66 56 -6 C56 46 50 82 46 110 L30 110 C36 74 40 30 36 -8 C26 -42 -26 -42 -36 -8 C-40 30 -36 74 -30 110 L-46 110 C-50 82 -56 46 -56 -6 Z" fill="#6e4d33"/>
      <rect x="-17" y="38" width="34" height="32" rx="13" fill="url(#skD)"/><rect x="-17" y="50" width="34" height="20" fill="#e6ac88" opacity=".2"/>
      <ellipse cx="-50" cy="4" rx="10" ry="14" fill="url(#skD)"/><ellipse cx="50" cy="4" rx="10" ry="14" fill="url(#skD)"/>
      <ellipse cx="0" cy="-2" rx="50" ry="58" fill="url(#skD)"/>
      <path d="M-32 -16 q12 -7 22 -1 M10 -17 q12 -6 22 1" stroke="#33241699" stroke-width="4.4" fill="none" stroke-linecap="round"/>
      <ellipse cx="-21" cy="0" rx="10.5" ry="7.6" fill="#fff"/><circle cx="-20" cy="0" r="5" fill="#5f7a52"/><circle cx="-18" cy="-2" r="1.5" fill="#fff"/>
      <ellipse cx="21" cy="0" rx="10.5" ry="7.6" fill="#fff"/><circle cx="22" cy="0" r="5" fill="#5f7a52"/><circle cx="24" cy="-2" r="1.5" fill="#fff"/>
      <path d="M-3 5 Q-7 18 3 18" stroke="#cd926090" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M-14 34 Q0 44 14 34" stroke="#bd6058" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M-52 -4 C-56 -62 -26 -80 0 -80 C26 -80 56 -62 52 -4 C46 -32 30 -34 22 -22 C18 -38 -16 -40 -22 -24 C-30 -36 -44 -30 -52 -4 Z" fill="#6e4d33"/>
    </g>

    <!-- armrests (in front of each person) -->
    <use href="#armrests" transform="translate(540,324) scale(.82)"/>
    <use href="#armrests" transform="translate(902,662) scale(.82)"/>
    <use href="#armrests" transform="translate(540,944) scale(.82)"/>
    <use href="#armrests" transform="translate(178,662) scale(.82)"/>
  </svg>

  <div class="card">
    <div class="chead">
      <div class="av"></div>
      <div class="who">
        <div class="n">James Hill <span class="vf"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span><span class="rt">★ 4.5</span></div>
        <div class="t">42 seconds ago</div>
      </div>
      <div class="addic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2347ec" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M18 8v6M21 11h-6"/></svg></div>
    </div>
    <div class="ctext"><h2>The Psychology<br/>of <i>Yes</i></h2></div>
    <div class="eng">
      <div class="it liked"><svg width="20" height="20" viewBox="0 0 24 24" fill="#2347ec" stroke="#2347ec" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v10M7 10l4-7a2 2 0 013 2l-1 5h5a2 2 0 012 2.3l-1.2 6A2 2 0 0119.8 20H7"/></svg>3.2k</div>
      <div class="it"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8a90a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 01-11.5 7.2L4 20l1-5A8 8 0 1121 12z"/></svg>214</div>
      <div class="it"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8a90a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>44k</div>
      <div class="it"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8a90a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg></div>
      <div class="it bm"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8a90a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 011 1v17l-7-4-7 4V4a1 1 0 011-1z"/></svg></div>
    </div>
  </div>

  <div class="tagline">Where great sellers don't <b>chase</b> the deal,<br/>they <b>earn</b> the yes.</div>
  <div class="url">rizzdial.com</div>
  <div class="grain"></div>
</div>
</body></html>
