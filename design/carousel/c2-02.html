<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="common.css"/>
<style>
  .body{margin-top:58px;}
  .p{margin-top:22px;max-width:820px;}
  .statrow{margin-top:50px;display:flex;align-items:center;gap:34px;}
  .statbig{font-size:172px;}
  .statrow .x{font-size:29px;color:#4b4e57;line-height:1.32;max-width:380px;}
  .statrow .x b{color:#15171d;font-weight:700;}
  .phones{margin-top:46px;display:flex;gap:14px;flex-wrap:wrap;max-width:900px;}
  .ph{width:60px;height:90px;border-radius:13px;border:2px solid rgba(21,23,29,.16);display:flex;align-items:center;justify-content:center;background:rgba(21,23,29,.03);}
  .ph.on{border-color:#2347ec;background:rgba(35,71,236,.10);}
  .lbl{margin-top:20px;font-family:var(--mono);font-size:20px;letter-spacing:.06em;color:rgba(21,23,29,.42);}
  .lbl b{color:#2347ec;}
</style></head>
<body>
<div class="canvas light">
  <div class="frame flow">
    <div class="head">
      <div class="logo"><span class="dot"></span><div><b>rizz</b><span>dial</span></div></div>
      <div class="counter"><em>02</em> / 05</div>
    </div>
    <div class="body">
      <div class="kick">The Trust Collapse</div>
      <h2 class="h2">A decade of spam taught everyone one habit: <span class="hi">don't pick up.</span></h2>
      <div class="statrow">
        <div class="statbig">94%</div>
        <div class="x">of calls from an <b>unknown number</b> now go straight to voicemail. The phone still works — the trust didn't survive.</div>
      </div>
      <div class="phones">
        <div class="ph"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a7a89f" stroke-width="2" stroke-linecap="round"><path d="M5 4h4l2 5-3 2a12 12 0 005 5l2-3 5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></svg></div>
        <div class="ph"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a7a89f" stroke-width="2" stroke-linecap="round"><path d="M5 4h4l2 5-3 2a12 12 0 005 5l2-3 5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></svg></div>
        <div class="ph"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a7a89f" stroke-width="2" stroke-linecap="round"><path d="M5 4h4l2 5-3 2a12 12 0 005 5l2-3 5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></svg></div>
        <div class="ph"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a7a89f" stroke-width="2" stroke-linecap="round"><path d="M5 4h4l2 5-3 2a12 12 0 005 5l2-3 5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></svg></div>
        <div class="ph"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a7a89f" stroke-width="2" stroke-linecap="round"><path d="M5 4h4l2 5-3 2a12 12 0 005 5l2-3 5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></svg></div>
        <div class="ph"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a7a89f" stroke-width="2" stroke-linecap="round"><path d="M5 4h4l2 5-3 2a12 12 0 005 5l2-3 5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></svg></div>
        <div class="ph"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a7a89f" stroke-width="2" stroke-linecap="round"><path d="M5 4h4l2 5-3 2a12 12 0 005 5l2-3 5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></svg></div>
        <div class="ph"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a7a89f" stroke-width="2" stroke-linecap="round"><path d="M5 4h4l2 5-3 2a12 12 0 005 5l2-3 5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></svg></div>
        <div class="ph"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a7a89f" stroke-width="2" stroke-linecap="round"><path d="M5 4h4l2 5-3 2a12 12 0 005 5l2-3 5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></svg></div>
        <div class="ph on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2347ec" stroke-width="2" stroke-linecap="round"><path d="M5 4h4l2 5-3 2a12 12 0 005 5l2-3 5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></svg></div>
      </div>
      <div class="lbl">10 calls from an unknown number · <b>1 answered</b></div>
    </div>
    <div class="foot">
      <div class="dots"><i></i><i class="on"></i><i></i><i></i><i></i></div>
      <div class="swipe">swipe <em>&rarr;</em></div>
    </div>
  </div>
</div>
</body></html>
