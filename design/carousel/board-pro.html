<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:#1a36c4;}
  .canvas{position:relative;width:1080px;height:1350px;overflow:hidden;
    font-family:'Inter Display','Inter',sans-serif;-webkit-font-smoothing:antialiased;
    background:radial-gradient(125% 105% at 50% 28%, #3257f4 0%, #2347ec 36%, #1a35bd 70%, #122594 100%), #122594;}
  /* depth vignette */
  .canvas::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:6;
    background:radial-gradient(140% 100% at 50% 46%, rgba(0,0,0,0) 52%, rgba(6,12,46,.46) 100%);}
  /* grain texture */
  .grain{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}

  .logo{position:absolute;top:50px;left:50%;transform:translateX(-50%);z-index:7;}
  .pill{position:absolute;top:150px;left:50%;transform:translateX(-50%);z-index:7;
    background:rgba(255,255,255,.96);color:#1a35bd;font-weight:700;font-size:23px;letter-spacing:-.01em;
    padding:11px 26px;border-radius:999px;box-shadow:0 12px 26px rgba(8,16,54,.32);}

  .scene{position:absolute;inset:0;z-index:2;}

  .card{position:absolute;left:298px;top:454px;width:484px;height:348px;z-index:4;
    background:linear-gradient(180deg,#ffffff,#f3f5fb);border-radius:30px;
    box-shadow:0 44px 80px rgba(8,16,54,.46), 0 4px 10px rgba(8,16,54,.3);padding:26px 30px;display:flex;flex-direction:column;}
  .chead{display:flex;align-items:center;gap:14px;}
  .av{width:54px;height:54px;border-radius:50%;flex:0 0 auto;overflow:hidden;
    background:linear-gradient(135deg,#2347ec,#3a5cff);display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:22px;box-shadow:0 4px 10px rgba(35,71,236,.4);}
  .who{display:flex;flex-direction:column;}
  .who .n{display:flex;align-items:center;gap:8px;font-family:'Inter Display','Inter',sans-serif;font-weight:800;font-size:24px;color:#15171d;letter-spacing:-.01em;}
  .who .n .vf{width:19px;height:19px;border-radius:50%;background:#2347ec;display:flex;align-items:center;justify-content:center;}
  .who .n .rt{color:#f0a93f;font-weight:700;font-size:20px;}
  .who .t{font-size:17px;color:#9aa0ac;margin-top:2px;}
  .addic{margin-left:auto;color:#2347ec;}
  .ctext{flex:1;display:flex;align-items:center;justify-content:center;}
  .ctext h2{font-family:'Bitstream Charter','Georgia',serif;font-weight:700;
    font-size:54px;color:#16223f;letter-spacing:0;text-align:center;line-height:1.02;}
  .ctext h2 i{font-style:italic;color:#2347ec;}
  .eng{display:flex;align-items:center;gap:30px;border-top:1px solid #eef0f5;padding-top:18px;}
  .eng .it{display:flex;align-items:center;gap:9px;color:#8a90a0;font-weight:600;font-size:20px;}
  .eng .it.liked{color:#2347ec;}
  .eng .bm{margin-left:auto;}

  .tagline{position:absolute;left:60px;right:60px;bottom:152px;z-index:7;text-align:center;
    font-weight:500;font-size:43px;line-height:1.26;color:#dbe3ff;letter-spacing:-.015em;}
  .tagline b{color:#fff;font-weight:800;}
  .url{position:absolute;bottom:74px;left:0;right:0;text-align:center;z-index:7;
    font-family:'Liberation Mono',monospace;font-size:22px;letter-spacing:.2em;color:rgba(255,255,255,.55);}
</style></head>
<body>
<div class="canvas">
  <!-- ============ LOGO (rebuilt as vector) ============ -->
  <svg class="logo" width="310" height="86" viewBox="0 0 310 86" fill="none">
    <g stroke="#ffffff" stroke-width="4" stroke-linecap="round">
      <line x1="2" y1="34" x2="26" y2="34"/><line x1="6" y1="46" x2="30" y2="46"/><line x1="14" y1="58" x2="34" y2="58"/>
    </g>
    <circle cx="58" cy="44" r="30" stroke="#ffffff" stroke-width="4" fill="none"/>
    <path d="M58 14 a30 30 0 0 1 24 48" stroke="#cdd9ff" stroke-width="4" fill="none" stroke-linecap="round" opacity=".7"/>
    <text x="58" y="58" fill="#ffffff" font-family="'Inter Display','Inter',sans-serif" font-weight="900" font-size="40" font-style="italic" text-anchor="middle">R</text>
    <text x="74" y="70" fill="#a8c4ff" font-family="'Inter','sans-serif'" font-weight="700" font-size="11" text-anchor="middle" letter-spacing="1">AI</text>
    <text x="100" y="58" fill="#ffffff" font-family="'Inter Display','Inter',sans-serif" font-weight="800" font-size="40" letter-spacing="-1">Rizz<tspan fill="#ffffff"> Dial</tspan></text>
  </svg>
  <div class="pill">The psychology of selling</div>

  <!-- ============ TOP-DOWN PEOPLE ============ -->
  <svg class="scene" viewBox="0 0 1080 1350" fill="none">
    <defs>
      <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
      <radialGradient id="skin" cx=".42" cy=".34" r=".75"><stop offset="0" stop-color="#f3d3af"/><stop offset="1" stop-color="#d3a079"/></radialGradient>
      <!-- body: shaded, color-agnostic overlays so one def works for all via currentColor -->
      <g id="body">
        <ellipse cx="0" cy="-138" rx="124" ry="74" fill="#0a1645" opacity=".34" filter="url(#soft)"/>
        <!-- hands -->
        <g><ellipse cx="-40" cy="-6" rx="20" ry="15" fill="url(#skin)"/><path d="M-50 -10 v-9 M-40 -12 v-10 M-30 -11 v-9" stroke="#c98f63" stroke-width="2.4" stroke-linecap="round"/></g>
        <g><ellipse cx="40" cy="-6" rx="20" ry="15" fill="url(#skin)"/><path d="M30 -11 v-9 M40 -12 v-10 M50 -10 v-9" stroke="#c98f63" stroke-width="2.4" stroke-linecap="round"/></g>
        <!-- forearms -->
        <line x1="-36" y1="-12" x2="-72" y2="-120" stroke="currentColor" stroke-width="36" stroke-linecap="round"/>
        <line x1="36" y1="-12" x2="72" y2="-120" stroke="currentColor" stroke-width="36" stroke-linecap="round"/>
        <line x1="-44" y1="-22" x2="-72" y2="-104" stroke="#ffffff" stroke-opacity=".12" stroke-width="9" stroke-linecap="round"/>
        <line x1="44" y1="-22" x2="72" y2="-104" stroke="#ffffff" stroke-opacity=".12" stroke-width="9" stroke-linecap="round"/>
        <!-- shoulders / upper body -->
        <ellipse cx="0" cy="-150" rx="108" ry="60" fill="currentColor"/>
        <!-- volume: top highlight + lower shadow -->
        <ellipse cx="0" cy="-170" rx="82" ry="30" fill="#ffffff" opacity=".15"/>
        <ellipse cx="0" cy="-120" rx="104" ry="34" fill="#000000" opacity=".14"/>
        <!-- neck -->
        <rect x="-20" y="-196" width="40" height="34" rx="16" fill="url(#skin)"/>
      </g>
    </defs>

    <!-- TOP — man bun -->
    <g transform="translate(540,454)">
      <use href="#body" style="color:#8893bd"/>
      <ellipse cx="0" cy="-214" rx="48" ry="51" fill="#2c2620"/>
      <circle cx="0" cy="-256" r="17" fill="#241f1a"/>
      <path d="M-34 -226 a40 40 0 0 1 60 -6" stroke="#4a4034" stroke-width="5" fill="none" stroke-linecap="round" opacity=".7"/>
    </g>
    <!-- BOTTOM — short hair -->
    <g transform="translate(540,798) rotate(180)">
      <use href="#body" style="color:#d8d0bf"/>
      <ellipse cx="0" cy="-214" rx="46" ry="49" fill="#1f2230"/>
      <path d="M-30 -232 a38 38 0 0 1 60 0" stroke="#3a3f52" stroke-width="5" fill="none" stroke-linecap="round" opacity=".7"/>
      <path d="M-6 -250 q6 16 0 30" stroke="#11131c" stroke-width="3" fill="none" opacity=".5"/>
    </g>
    <!-- LEFT — long hair (falls over shoulders) -->
    <g transform="translate(300,626) rotate(-90)">
      <use href="#body" style="color:#b65a55"/>
      <path d="M-58 -150 C-70 -210 -40 -252 0 -252 C40 -252 70 -210 58 -150 C40 -176 -40 -176 -58 -150 Z" fill="#2a1f1a"/>
      <ellipse cx="0" cy="-214" rx="46" ry="50" fill="#33251d"/>
      <path d="M-32 -228 a40 40 0 0 1 64 0" stroke="#5a4030" stroke-width="5" fill="none" stroke-linecap="round" opacity=".7"/>
    </g>
    <!-- RIGHT — curly -->
    <g transform="translate(780,626) rotate(90)">
      <use href="#body" style="color:#6f55c4"/>
      <g fill="#241a14">
        <circle cx="0" cy="-216" r="44"/><circle cx="-34" cy="-200" r="18"/><circle cx="34" cy="-200" r="18"/>
        <circle cx="-30" cy="-236" r="17"/><circle cx="30" cy="-236" r="17"/><circle cx="0" cy="-250" r="18"/>
      </g>
      <circle cx="-12" cy="-224" r="8" fill="#3e2c20" opacity=".7"/>
    </g>
  </svg>

  <!-- ============ POST CARD (the table) ============ -->
  <div class="card">
    <div class="chead">
      <div class="av">JH</div>
      <div class="who">
        <div class="n">James Hill <span class="vf"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span><span class="rt">★ 4.5</span></div>
        <div class="t">42 seconds ago</div>
      </div>
      <div class="addic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2347ec" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M18 8v6M21 11h-6"/></svg></div>
    </div>
    <div class="ctext"><h2>The Psychology<br/>of <i>Yes</i></h2></div>
    <div class="eng">
      <div class="it liked"><svg width="22" height="22" viewBox="0 0 24 24" fill="#2347ec" stroke="#2347ec" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v10M7 10l4-7a2 2 0 013 2l-1 5h5a2 2 0 012 2.3l-1.2 6A2 2 0 0119.8 20H7"/></svg>3.2k</div>
      <div class="it"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8a90a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 01-11.5 7.2L4 20l1-5A8 8 0 1121 12z"/></svg>214</div>
      <div class="it"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8a90a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>44k</div>
      <div class="it"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8a90a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg></div>
      <div class="it bm"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8a90a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 011 1v17l-7-4-7 4V4a1 1 0 011-1z"/></svg></div>
    </div>
  </div>

  <div class="tagline">Where great sellers don't <b>chase</b> the deal,<br/>they <b>earn</b> the yes.</div>
  <div class="url">rizzdial.com</div>
  <div class="grain"></div>
</div>
</body></html>
