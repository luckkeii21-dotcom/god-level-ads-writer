<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:#fff;}
  .canvas{position:relative;width:1080px;height:1350px;overflow:hidden;background:#ffffff;
    font-family:'Liberation Sans',Arial,sans-serif;-webkit-font-smoothing:antialiased;}
  .hero{position:absolute;top:0;right:-205px;height:1350px;width:auto;z-index:1;}
  .frame{position:absolute;inset:0;z-index:3;padding:70px 80px 70px;}
  .logo{display:flex;align-items:center;gap:13px;font-weight:700;font-size:30px;letter-spacing:-.02em;color:#15171d;}
  .logo .dot{width:19px;height:19px;border-radius:50%;background:#2347ec;box-shadow:0 0 0 5px rgba(35,71,236,.10);}
  .logo span{color:#2347ec;}
  .head{position:absolute;left:80px;top:360px;}
  .k1{font-weight:700;font-size:118px;line-height:.92;letter-spacing:-.035em;color:#16181f;}
  .k2{font-family:'Z003','URW Chancery L',cursive;font-style:italic;font-size:168px;line-height:.8;
    color:#2347ec;margin-top:6px;margin-left:-6px;}
  .uline{display:block;margin-top:-6px;}
  .sub{margin-top:48px;max-width:390px;font-size:30px;line-height:1.34;color:#54585f;font-weight:400;letter-spacing:-.01em;}
  .url{position:absolute;left:80px;bottom:64px;font-size:24px;letter-spacing:.02em;color:#3f4a57;font-weight:600;
    text-shadow:0 0 10px #fff,0 0 10px #fff,0 0 6px #fff;}
</style></head>
<body>
  <div class="canvas">
    <img class="hero" src="assets/hero-a.png" alt="red handset jet"/>
    <div class="frame">
      <div class="logo"><span class="dot"></span><div><b>rizz</b><span>dial</span></div></div>
      <div class="head">
        <div class="k1">Always</div>
        <div class="k2">first.</div>
        <svg class="uline" width="248" height="26" viewBox="0 0 248 26" fill="none">
          <path d="M6 17 C 70 6, 175 6, 240 12" stroke="#2347ec" stroke-width="5" stroke-linecap="round" fill="none"/>
        </svg>
        <div class="sub">A live AI call to every new lead in under 60 seconds.</div>
      </div>
      <div class="url">www.rizzdial.com</div>
    </div>
  </div>
</body></html>
