<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="common.css"/>
<style>
  .hero{position:absolute;left:50%;top:250px;transform:translateX(-50%);width:300px;height:430px;z-index:2;}
  .hero svg{filter:drop-shadow(0 18px 22px rgba(90,80,50,.18));}
  .shadow{position:absolute;left:50%;top:632px;transform:translateX(-50%);
    width:208px;height:32px;border-radius:50%;
    background:radial-gradient(closest-side, rgba(70,62,40,.30), rgba(70,62,40,0));z-index:1;}
  .copy{position:absolute;left:76px;right:76px;top:872px;z-index:3;}
  .headline{font-size:62px;line-height:1.0;}
  .sub{margin-top:34px;max-width:880px;}
</style></head>
<body>
  <div class="canvas light">
    <div class="frame">
      <div class="head">
        <div class="logo"><span class="dot"></span><div><b>rizz</b><span>dial</span></div></div>
        <div class="counter"><em>02</em> / 06</div>
      </div>

      <div class="shadow"></div>
      <div class="hero">
        <svg viewBox="0 0 300 430" fill="none">
          <defs>
            <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
              <stop offset=".5" stop-color="#dfe7f5" stop-opacity=".30"/>
              <stop offset="1" stop-color="#ffffff" stop-opacity=".55"/>
            </linearGradient>
            <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#c9cfda"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#b8c0cd"/>
            </linearGradient>
            <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#5b78ff"/><stop offset="1" stop-color="#2f53f0"/>
            </linearGradient>
          </defs>
          <!-- glass body (two curved chambers) -->
          <path d="M78 62 C 78 150 120 188 150 206 C 180 188 222 150 222 62 Z"
                fill="url(#glass)" stroke="#aeb8cc" stroke-width="2.5"/>
          <path d="M150 206 C 120 224 78 262 78 350 L 222 350 C 222 262 180 224 150 206 Z"
                fill="url(#glass)" stroke="#aeb8cc" stroke-width="2.5"/>
          <!-- top sand (chamber draining) -->
          <path d="M99 96 C 118 150 138 184 150 200 C 162 184 182 150 201 96 Z" fill="url(#sand)"/>
          <!-- falling stream -->
          <rect x="147.5" y="200" width="5" height="118" rx="2.5" fill="#3a5cf5" opacity=".9"/>
          <!-- bottom mound -->
          <path d="M112 350 C 124 322 138 312 150 312 C 162 312 176 322 188 350 Z" fill="url(#sand)"/>
          <!-- caps -->
          <rect x="66" y="50" width="168" height="15" rx="7.5" fill="url(#cap)"/>
          <rect x="66" y="345" width="168" height="15" rx="7.5" fill="url(#cap)"/>
          <!-- highlight -->
          <path d="M92 78 C 92 140 116 172 138 190" stroke="#ffffff" stroke-width="3" stroke-opacity=".6" stroke-linecap="round" fill="none"/>
        </svg>
      </div>

      <div class="copy">
        <div class="eyebrow">The Problem</div>
        <h1 class="headline">The second a lead hits submit,<br/>they're talking to your<br/><span class="hi">competitors too.</span></h1>
        <p class="sub">Intent fades by the minute. The first company to respond almost always wins the deal — and most teams take hours.</p>
      </div>

      <div class="foot">
        <div class="dots"><i></i><i class="on"></i><i></i><i></i><i></i><i></i></div>
        <div class="swipe">swipe <em>&rarr;</em></div>
      </div>
    </div>
  </div>
</body></html>
